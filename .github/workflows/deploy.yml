# On every push to master: run the backend tests, then deploy to the server if they pass.
# Server-side steps are in deploy/deploy.sh; one-time setup is in docs/DEPLOY_AZURE.md (Part 13).
name: Test and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Same image and credentials as docker-compose.yml, on the port backend/tests/conftest.py expects.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: erickshaw
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # Drop blank lines and stray spaces picked up when copying the key from a terminal.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//; /^$/d' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Explain a bad DEPLOY_SSH_KEY secret without printing it (only its shape and public fingerprint).
          [ -n "$SSH_KEY" ] || { echo "::error::DEPLOY_SSH_KEY secret is empty or missing (check the name)"; exit 1; }
          head -1 ~/.ssh/deploy_key | grep -qx -- '-----BEGIN OPENSSH PRIVATE KEY-----' ||
            { echo "::error::DEPLOY_SSH_KEY does not start with the -----BEGIN OPENSSH PRIVATE KEY----- line ($(wc -l < ~/.ssh/deploy_key) lines)"; exit 1; }
          grep -qx -- '-----END OPENSSH PRIVATE KEY-----' ~/.ssh/deploy_key ||
            { echo "::error::DEPLOY_SSH_KEY has no -----END OPENSSH PRIVATE KEY----- line ($(wc -l < ~/.ssh/deploy_key) lines)"; exit 1; }
          fp=$(ssh-keygen -lf ~/.ssh/deploy_key) ||
            { echo "::error::DEPLOY_SSH_KEY is not a valid key ($(wc -l < ~/.ssh/deploy_key) lines; expected 7)"; exit 1; }
          echo "::notice::Deploy key fingerprint: $fp"
          [ -n "$KNOWN_HOSTS" ] || { echo "::error::DEPLOY_KNOWN_HOSTS secret is empty or missing"; exit 1; }
      - name: Deploy
        # The deploy key is restricted on the server to run deploy/deploy.sh only.
        run: ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes azureuser@${{ secrets.DEPLOY_HOST }} /opt/erick/deploy/deploy.sh
