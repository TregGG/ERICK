services:
  database:
    image: postgis/postgis:16-3.4
    container_name: erick-postgis
    environment:
      POSTGRES_DB: erickshaw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "55432:5432"
    volumes:
      - erick-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erickshaw"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  erick-postgres-data:
