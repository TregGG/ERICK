<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Campus Rick · IIT Roorkee</title>
  <meta name="theme-color" content="#2e7d32">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="/shared/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="/shared/js/theme-init.js"></script>
  <link rel="stylesheet" href="/shared/css/base.css">
  <link rel="stylesheet" href="css/passenger.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">&#x1F6FA;</span><span>Campus Rick<small>IIT Roorkee</small></span></div>
      <span class="spacer"></span>
      <span id="theme-slot"></span>
      <span id="conn" class="pill" role="status"></span>
      <button id="menu-btn" class="pill" aria-label="Open menu" hidden>&#9776;</button>
    </header>
    <div id="map" role="region" aria-label="Campus map"></div>
    <div id="map-notice" class="map-notice" hidden></div>
    <div class="map-fabs" id="fabs">
      <button class="fab" id="locate-btn" aria-label="Show my location" title="Show my location">&#x1F4CD;</button>
    </div>
    <section id="sheet" class="sheet" aria-live="polite">
      <button class="sheet-handle" id="sheet-handle" aria-label="Expand or collapse panel"><span></span></button>
      <div class="sheet-body" id="sheet-body">
        <div class="stack"><div class="skeleton" style="height:22px;width:60%"></div><div class="skeleton" style="height:48px"></div><div class="skeleton" style="height:48px"></div></div>
      </div>
    </section>
  </div>
</body>
</html>
